<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flasky</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background: white;
        }

        .navbar {
            height: 63px;
            background: #222;
            border-radius: 0 0 4px 4px;
        }

        .navbar-container {
            width: 1425px;
            max-width: calc(100% - 30px);
            margin: 0 auto;
            height: 100%;

            display: flex;
            align-items: center;
        }

        .brand {
            color: #aaa;
            font-size: 24px;
            text-decoration: none;
            margin-right: 38px;
        }

        .home {
            color: #aaa;
            font-size: 18px;
            text-decoration: none;
        }

        .container {
            width: 1425px;
            max-width: calc(100% - 30px);
            margin: 0 auto;
            padding-top: 76px;
        }

        /* MENSAGEM FLASH */
        .alert {
            background-color: #fcf8e3;
            border: 1px solid #faebcc;
            color: #8a6d3b;

            padding: 18px 10px;
            margin: -76px 0 76px 0;

            font-size: 18px;
        }

        h1 {
            font-size: 44px;
            font-weight: 400;
            margin: 0 0 22px;
            padding-bottom: 23px;
            border-bottom: 1px solid #eee;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            height: 53px;
            padding: 8px 12px;
            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;
        }

        input[type="text"]:focus {
            border-color: #66afe9;
        }

        button {
            margin-top: 17px;
            padding: 12px 20px;

            font-size: 16px;
            color: #222;
            background: #fff;

            border: 1px solid #ccc;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }

        .hello {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="brand">Flasky</a>
            <a href="/" class="home">Home</a>
        </div>
    </nav>

    <main class="container">

        <!-- MENSAGEM FLASH -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        {% if name %}
            <h1>Hello, {{ name }}!</h1>
        {% else %}
            <h1>Hello, Stranger!</h1>
        {% endif %}


        <form method="POST">

            <label for="name">What is your name?</label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <button type="submit">Submit</button>

        </form>

    </main>

</body>
</html>
